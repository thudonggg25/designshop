<meta charset="utf-8">
<title>Thư viện Hyan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Apple-style dark dashboard. Floating icon rail on the left, one material board with the catalog (scrolls) and a "Brief" inspector on the right.
   Type: SF Pro on Apple devices (system font), Inter as the fallback elsewhere. Colors follow Apple's dark system palette. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --material: rgba(22, 22, 26, 0.72);
  --surface: #1C1C1E;
  --surface-2: #242427;
  --elev: #2C2C2E;
  --fill: rgba(118, 118, 128, 0.24);
  --fill-2: rgba(118, 118, 128, 0.16);
  --fill-3: rgba(118, 118, 128, 0.10);
  --sep: rgba(255, 255, 255, 0.08);
  --sep-2: rgba(255, 255, 255, 0.14);
  --label: #F5F5F7;
  --label-2: rgba(235, 235, 245, 0.62);
  --label-3: rgba(235, 235, 245, 0.34);
  --blue: #0A84FF;
  --blue-soft: rgba(10, 132, 255, 0.16);
  --green: #30D158;
  --green-soft: rgba(48, 209, 88, 0.14);
  --orange: #FF9F0A;
  --red: #FF453A;
  --ink: #0B0B10;
  --tile: #0B0B0E;
  --sheet: #0B0B10; --sheet-card: #17161E;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, "JetBrains Mono", monospace;
  --blur: blur(30px) saturate(160%);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --rail-w: 60px;
  --aside-w: 380px;
  /* aliases kept for preview/export styles */
  --fg: var(--label); --muted: var(--label-2); --faint: var(--label-3); --edge: var(--sep); --edge-2: var(--sep-2);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--bg); }
body { margin: 0; color: var(--label); font-family: var(--sans); font-size: 14px; line-height: 1.45; letter-spacing: -.008em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow: hidden; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* Deep space behind the glass: nebula clouds, light streaks and two star layers (pure CSS, cheap to paint) */
.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(ellipse 34% 30% at 10% 12%, rgba(120, 130, 200, .45), transparent 70%),
    radial-gradient(ellipse 22% 26% at 20% 58%, rgba(215, 150, 135, .32), transparent 70%),
    radial-gradient(ellipse 30% 26% at 86% 72%, rgba(100, 120, 190, .32), transparent 70%),
    radial-gradient(ellipse 40% 30% at 60% 4%, rgba(70, 100, 170, .22), transparent 70%),
    radial-gradient(ellipse 60% 50% at 50% 50%, #0E0D14, #050508 75%); }
.ambient::before, .ambient::after { content: ""; position: absolute; inset: -50%; background-repeat: repeat; }
.ambient::before { /* small stars */
  background-image:
    radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,.85), transparent 60%),
    radial-gradient(1px 1px at 120px 80px, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1px 1px at 60px 150px, rgba(200,220,255,.7), transparent 60%),
    radial-gradient(1px 1px at 170px 190px, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.2px 1.2px at 90px 220px, rgba(255,240,220,.7), transparent 60%),
    radial-gradient(1px 1px at 200px 120px, rgba(255,255,255,.45), transparent 60%);
  background-size: 230px 240px; opacity: .8; animation: twinkle 6s ease-in-out infinite alternate; }
.ambient::after { /* bright stars with a cyan halo, and two soft light streaks */
  background-image:
    radial-gradient(2px 2px at 140px 90px, #fff, rgba(140,230,255,.5) 40%, transparent 70%),
    radial-gradient(1.6px 1.6px at 380px 300px, #fff, rgba(140,230,255,.4) 40%, transparent 70%),
    radial-gradient(1.8px 1.8px at 520px 60px, #fff, rgba(180,200,255,.4) 40%, transparent 70%);
  background-size: 640px 420px; opacity: .9; }
.streak { position: fixed; z-index: -1; pointer-events: none; width: 70vmax; height: 9vmax; border-radius: 50%; filter: blur(30px); opacity: .75;
  background: linear-gradient(90deg, transparent, rgba(150,180,255,.55) 30%, rgba(255,240,240,.75) 52%, rgba(240,170,170,.45) 70%, transparent); }
.streak.s1 { top: 6%; right: -18vmax; transform: rotate(-16deg); }
.streak.s2 { bottom: -2%; left: -24vmax; transform: rotate(-8deg); opacity: .22; }
.vignette { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.6) 100%); }
@keyframes twinkle { from { opacity: .55; } to { opacity: .9; } }
.ambient::before { opacity: .55; }
.streak.s1 { opacity: .35; }

.glass { position: relative; background: var(--material); border: 1px solid var(--sep); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 40px 120px rgba(0,0,0,.65); }

/* App shell */
.app { height: 100%; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); gap: 16px; align-items: center;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Icon rail */
.rail { position: relative; z-index: 20; justify-self: center; width: var(--rail-w); border-radius: 22px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rail .sep { width: 22px; height: 1px; background: var(--sep-2); margin: 4px 0; }
.ri { position: relative; width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; color: var(--label-2); display: grid; place-items: center; transition: background .12s, color .12s, transform .1s; }
.ri svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ri:hover { color: var(--label); background: var(--fill-2); }
.ri:active { transform: scale(.92); }
.ri[aria-current="true"] { background: var(--blue); color: #fff; }
.ri .tip { position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%) translateX(-4px); white-space: nowrap; background: var(--elev); border: 1px solid var(--sep-2); padding: 5px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--label); opacity: 0; pointer-events: none; transition: opacity .1s, transform .1s; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.ri:hover .tip, .ri:focus-visible .tip { opacity: 1; transform: translateY(-50%) translateX(0); }
.ri .dot { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--label); color: var(--ink); font-size: 10px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.ri[aria-current="true"] .dot { background: #fff; color: var(--blue); }
.ri.sel-btn { display: none; }

/* Board */
.board { height: 100%; min-height: 0; border-radius: 26px; display: grid; grid-template-columns: minmax(0, 1fr) var(--aside-w); overflow: hidden; }
.main { min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
.top { position: sticky; top: 0; z-index: 10; padding: 28px 32px 0; background: #141417; border-bottom: 1px solid var(--sep); }
.top-row { display: flex; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; }
.title { min-width: 0; margin-right: auto; }
.eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--label-3); text-transform: uppercase; }
.title h1 { margin: 0; font-family: var(--display); font-size: clamp(26px, 3vw, 34px); font-weight: 700; letter-spacing: -.025em; line-height: 1.1; text-wrap: balance; }
.subtitle { margin: 6px 0 0; font-size: 14px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.search { width: 260px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--fill-2); border: 1px solid transparent; transition: border-color .12s, background .12s; }
.search svg { width: 16px; height: 16px; stroke: var(--label-3); fill: none; stroke-width: 1.8; flex: none; }
.search input { background: transparent; border: 0; outline: 0; width: 100%; min-width: 0; font-size: 14px; }
.search input::placeholder { color: var(--label-3); }
.search:focus-within { background: var(--fill); border-color: var(--blue); }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--fill-2); }
.seg button { border: 0; background: transparent; height: 30px; padding: 0 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--label-2); transition: background .12s, color .12s; }
.seg button[aria-pressed="true"] { background: #636366; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.seg button:active { transform: scale(.96); }
.lang.seg button { padding: 0 11px; letter-spacing: .02em; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 18px -32px 0; padding: 0 32px 14px; -webkit-mask: linear-gradient(90deg, transparent, #000 32px, #000 calc(100% - 48px), transparent); mask: linear-gradient(90deg, transparent, #000 32px, #000 calc(100% - 48px), transparent); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--fill-3); color: var(--label-2); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .12s, color .12s, transform .08s; }
.tab:hover { background: var(--fill); color: var(--label); }
.tab:active { transform: scale(.96); }
.tab small { font-size: 12px; color: var(--label-3); font-variant-numeric: tabular-nums; }
.pbar { height: 2px; margin: 0 -32px; background: transparent; }
.pbar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .25s var(--ease); }
.pbar.done i { background: var(--green); }

.content { position: relative; z-index: 0; isolation: isolate; padding: 8px 32px 56px; }
.folder { margin-top: 32px; }
.folder-head { margin-bottom: 4px; }
.folder-head h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -.022em; }
.folder-head p { margin: 4px 0 0; color: var(--label-2); font-size: 14px; }
.section { margin-top: 28px; scroll-margin-top: 210px; }
.section-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--sep); }
.section-head h3 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: -.018em; }
.section-head .codes { font-family: var(--mono); font-size: 11.5px; color: var(--label-2); background: var(--fill-2); border-radius: 6px; padding: 2px 7px; }
.section-head .cnt { margin-left: auto; font-size: 13px; color: var(--label-3); font-variant-numeric: tabular-nums; }
.section-head .note { color: var(--label-2); font-size: 13px; flex-basis: 100%; }
.group-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--label-3); margin: 20px 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 16px; }

/* Token card: preview on top, name and value below, select circle in the corner. The whole card toggles. */
.item { position: relative; display: flex; flex-direction: column; border-radius: 18px; padding: 8px; background: var(--surface); border: 0; box-shadow: inset 0 0 0 1px var(--sep); transition: transform .14s var(--ease), background .14s, box-shadow .14s; min-width: 0; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; animation: rise .16s ease-out both; }
.item:hover { transform: translateY(-2px); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--sep-2), 0 18px 40px rgba(0,0,0,.45); }
.item:active { transform: scale(.985); transition-duration: .06s; }
.item.picked { box-shadow: inset 0 0 0 2px var(--blue), 0 0 0 4px var(--blue-soft); }
.item.pop { animation: pop .2s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.97); } 60% { transform: scale(1.01); } 100% { transform: none; } }
.media { position: relative; }
.pv { height: 150px; display: grid; place-items: center; padding: 14px; background: var(--tile); border-radius: 12px; overflow: hidden; position: relative; }
.pick { position: absolute; top: 8px; right: 8px; z-index: 3; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.42); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: background .12s, box-shadow .12s, transform .12s; }
.pick svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pick .ck { display: none; }
.item:hover .pick { transform: scale(1.08); }
.item.picked .pick { background: var(--blue); box-shadow: inset 0 0 0 1.5px var(--blue), 0 2px 10px rgba(10,132,255,.5); }
.item.picked .pick .pl { display: none; }
.item.picked .pick .ck { display: block; }
.info { padding: 12px 6px 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.name { font-size: 14.5px; font-weight: 600; color: var(--label); letter-spacing: -.012em; line-height: 1.3; overflow-wrap: anywhere; }
.meta { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.code { font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--label-2); flex: none; }
.item.picked .code { color: var(--blue); }
.theme-tag { font-size: 11px; color: var(--label-2); background: var(--fill-2); border-radius: 5px; padding: 0 5px; flex: none; }
.val { font-size: 12.5px; color: var(--label-3); min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Preview kinds (solid colors, so exports render exactly) */
.pv.tall { height: 150px; padding: 0; }
.sw { width: 100%; height: 100%; border-radius: 10px; border: 1px solid rgba(255,255,255,.07); display: flex; align-items: flex-end; justify-content: space-between; padding: 10px 12px; font-family: var(--mono); font-size: 11px; }
.pv-text { background: #14171C; }
.pv-text p { margin: 0; font-size: 16px; text-align: center; font-family: "Segoe UI", "Be Vietnam Pro", system-ui, sans-serif; }
.pv-type > div { font-family: "Segoe UI", "Be Vietnam Pro", system-ui, sans-serif; max-width: 100%; text-align: center; overflow-wrap: anywhere; color: #fff; }
.pv-effect { background: radial-gradient(circle at 28% 35%, rgba(74,163,234,.35), transparent 42%), radial-gradient(circle at 75% 70%, rgba(240,178,122,.35), transparent 44%), #050608; }
.fx { width: 128px; height: 74px; border-radius: 16px; background: #14171C; display: grid; place-items: center; color: rgba(255,255,255,.6); font-size: 11px; font-family: var(--mono); }
.fx.glow { background: #4AA3EA; color: #fff; }
.pv-frame .fr { font-size: 12px; color: rgba(255,255,255,.6); display: flex; align-items: center; max-width: 100%; }
.pv-frame .fr.box { width: 160px; }
.pv-icon svg { width: 44px; height: 44px; stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.lay { width: 100%; }
.lay > i { display: block; min-height: 26px; border-radius: 6px; background: #1E2229; border: 1px solid rgba(255,255,255,.07); }
.lay.l02 > i { min-height: 18px; }
.lay.l02 > i:nth-child(1) { background: #050608; height: 22px; }
.lay.l02 > i:nth-child(2) { background: rgba(74,163,234,.25); }
.lay.l04 > i:first-child { min-height: 8px; width: 40%; background: rgba(255,255,255,.18); }
.lay.l04 > i:last-child { min-height: 52px; }
.pv-rule { background: #0B0D10; place-items: start; }
.pv-rule p { margin: 0; font-size: 12px; color: rgba(255,255,255,.62); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.pv-rule b { color: #fff; font-weight: 600; }
.pv-pal { padding: 0; display: flex; align-items: stretch; }
.pv-pal > i { flex: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-style: normal; font-family: var(--mono); font-size: 9px; }
.pv-font { flex-direction: column; gap: 4px; text-align: center; background: #0B0D10; }
.pv-font .big { font-size: 44px; line-height: 1; color: #fff; }
.pv-font .small { font-size: 13px; color: rgba(255,255,255,.7); }
.pv-pair { background: #F5F3EF; color: #18181B; text-align: left; place-items: center start; padding: 16px 18px; }
.pv-pair .hd { font-size: 24px; line-height: 1.05; }
.pv-pair .bd { font-size: 11.5px; line-height: 1.45; color: #52525B; margin-top: 6px; }
.pv-ts { place-items: end start; padding: 12px 14px; background: #0B0D10; }
.pv-ts .row { display: flex; align-items: baseline; gap: 8px; color: #fff; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; line-height: 1; }
.pv-rad > div { width: 96px; height: 70px; background: #E9E9EC; }
.pv-btn span.b { display: inline-block; font-family: "Be Vietnam Pro", sans-serif; font-size: 13px; border: 0; white-space: nowrap; }
.pv-fmt { background: #0B0D10; }
.pv-fmt .f { border: 1.5px solid rgba(255,255,255,.7); background: rgba(255,255,255,.06); display: grid; place-items: center; font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,.8); border-radius: 3px; }
.pv-fx-text > div { font-family: "Be Vietnam Pro", sans-serif; font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -.01em; }

.pv.tall { padding: 0; }
.state { padding: 80px 0; text-align: center; color: var(--label-2); font-size: 15px; }

/* Brief inspector (right) */
.aside { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--sep); background: rgba(12,12,14,.35); }
.ah { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 28px 24px 14px; }
.ah h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -.022em; display: flex; align-items: center; gap: 10px; }
.badge { min-width: 24px; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--blue); color: #fff; font-family: var(--sans); font-size: 13px; font-weight: 600; letter-spacing: 0; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.badge.zero { background: var(--fill); color: var(--label-2); }
.asub { margin: 4px 0 0; color: var(--label-2); font-size: 13px; }
.ah .x { display: none; flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--fill-2); color: var(--label-2); }
.ab { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 18px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }

/* Progress summary */
.psum { padding: 16px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--sep); }
.psum-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.psum-h b { font-size: 15px; font-weight: 600; }
.psum-h span { font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.psum-h span strong { color: var(--label); font-weight: 600; }
.bar { height: 6px; border-radius: 999px; background: var(--fill-2); overflow: hidden; margin: 12px 0 10px; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--blue); transition: width .25s var(--ease); }
.bar.done i { background: var(--green); }
.prog-msg { font-size: 13px; color: var(--label-2); margin: 0; }
.prog-msg.ok { color: var(--green); }

/* Numbered steps, grouped like an Apple inset list */
.glabel { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 8px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--label-3); }
.inset { border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--sep); overflow: hidden; }
.steps { list-style: none; margin: 0; padding: 0; }
.step { position: relative; padding: 11px 14px; cursor: pointer; transition: background .1s; }
.step + .step::before { content: ""; position: absolute; top: 0; left: 50px; right: 0; height: 1px; background: var(--sep); }
.step:hover { background: var(--fill-3); }
.step-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--label-2); box-shadow: inset 0 0 0 1.5px var(--sep-2); }
.step.ok .num { background: var(--green); color: #000; box-shadow: none; }
.step.opt:not(.ok) .num { box-shadow: inset 0 0 0 1.5px var(--fill); color: var(--label-3); }
.sl { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.sl b { font-size: 14px; font-weight: 500; color: var(--label); }
.sl small { font-size: 12px; color: var(--label-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-r { font-size: 12.5px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.st-r.need { color: var(--orange); }
.st-r.optl { color: var(--label-3); }

.cta:active { transform: scale(.98); }
.sec { height: 42px; border-radius: 12px; border: 0; background: var(--fill-2); color: var(--label); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: background .12s, transform .08s; }

/* Export sheet: off-screen, solid colors only */

.item:hover .fx-liquid::before { top: -15%; border-radius: 0; }
.fx-shimmer { overflow: hidden; }
.fx-shimmer::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); transform: translateX(-120%); pointer-events: none; }
.item:hover .fx-shimmer::after { transform: translateX(120%); transition: transform .7s ease; }
.fx-draw::before { content: ""; position: absolute; inset: -2px; border-radius: inherit; padding: 2px; background: conic-gradient(var(--c1, #2F6BFF) var(--p), transparent 0); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; transition: --p .55s ease-out; pointer-events: none; }

.fx-beam { position: relative; }
.fx-beam::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; background: conic-gradient(from var(--a), transparent 0 72%, rgba(157,184,255,.9) 88%, #fff 96%, transparent 100%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: beam 3s linear infinite paused; pointer-events: none; }
.item:hover .fx-beam::before { animation-play-state: running; }

.mv-lift { transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s; }

.item:hover .mv-ripple::after { transform: scale(4); opacity: 0; transition: transform .6s ease-out, opacity .6s ease-out; }
.mv-underline::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: #9DB8FF; transition: width .25s ease-out; }
.item:hover .mv-underline::after { width: 100%; }
.item:hover .mv-blur { animation: mvBlur .5s ease-out both; }

.mv-pulse { animation: mvPulse 1.5s ease-out infinite paused; }
.mv-skel { background: linear-gradient(90deg, #DCDFE6 25%, #F4F5F8 50%, #DCDFE6 75%) 0 0 / 200% 100%; animation: mvSkel 1.2s linear infinite paused; }

@keyframes mvPress { 0%, 100% { transform: scale(1); } 50% { transform: scale(.94); } }

let lang = "vi";
try { lang = localStorage.getItem("hyan-lang") === "en" ? "en" : "vi"; } catch (e) {}
const libName = () => (lang === "en" && state.en?.name) || state.lib.name;
const t = (k, ...a) => { const v = UI[lang][k]; return typeof v === "function" ? v(...a) : v; };

const state = { lib: null, en: null, cats: [], items: new Map(), filter: "all", q: "", cart: [], fmt: "text" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

try { state.cart = JSON.parse(localStorage.getItem("hyan-cart") || "[]"); } catch (e) { state.cart = []; }
const saveCart = () => { try { localStorage.setItem("hyan-cart", JSON.stringify(state.cart)); } catch (e) {} };

/* Localisation of data */
const EN = () => (lang === "en" && state.en) || null;
function loc(it) {
  const en = EN(); if (!en) return it;
  const o = en.items[it.id]; if (!o) return it;
  const r = { ...it, ...o };
  if (it.kind === "mood" && it.html && o.name) r.html = it.html.replace(`>${it.name}<`, `>${esc(o.name)}<`);
  return r;
}
const folderLabel = (f) => (EN() && EN().folders[f.id]?.label) || f.label;
const folderDesc = (f) => (EN() && EN().folders[f.id]?.desc) || f.desc;
const catLabel = (c) => (EN() && EN().categories[c.id]?.label) || c.label;
const catNote = (c) => (EN() && (EN().categories[c.id]?.note || EN().categories[c.id]?.style)) || c.note || c.style || "";
const groupLabel = (g) => (EN() && EN().groups[g]) || g;
const codeLabel = (it) => it.theme ? `${it.code} (${it.theme})` : it.code;
const catOf = (it) => state.cats.find(c => c.id === it.catId);

async function load() {
  try {
    const lib = await (await fetch("data/library.json")).json();
    state.lib = lib;
    const cats = lib.folders.flatMap(f => f.categories.map(c => ({ ...c, folder: f.id })));
    const [files, en] = await Promise.all([
      Promise.all(cats.map(c => fetch("data/" + c.file).then(r => r.json()))),
      fetch("data/i18n.en.json").then(r => r.ok ? r.json() : null).catch(() => null)
    ]);
    state.en = en;
    state.cats = cats.map((c, i) => ({ ...c, ...files[i] }));
    state.cats.forEach(c => c.groups.forEach(g => g.items.forEach(it => {
      it.kind = c.kind; it.catId = c.id; it.folder = c.folder; it.group = g.label;
      state.items.set(it.id, it);
    })));
    state.cart = state.cart.filter(id => state.items.has(id));
    const hv = [...state.items.values()].filter(it => it.hover).map(it => `.item[data-id="${it.id}"]:hover .hv{${it.hover.split(";").filter(Boolean).map(d => d.trim() + " !important").join(";")}}`);
    let st = document.getElementById("hoverCss"); if (!st) { st = document.createElement("style"); st.id = "hoverCss"; document.head.appendChild(st); }
    st.textContent = hv.join("\n");
    loadFonts(); applyLang();
  } catch (e) {
    $("#main").innerHTML = `<div class="state">${t("loadFail")}</div>`;
  }
}

function loadFonts() {
  const fc = state.cats.find(c => c.kind === "font"); if (!fc) return;
  const fams = fc.groups.flatMap(g => g.items).map(f => `family=${f.family.replace(/ /g, "+")}:wght@${f.weights}`);
  fams.push("family=Noto+Serif+JP:wght@500");
  const l = document.createElement("link"); l.rel = "stylesheet";
  l.href = `https://fonts.googleapis.com/css2?${fams.join("&")}&display=swap`;
  (document.head || document.body).appendChild(l);
}

const countIn = (folderId, onlyCart) => [...state.items.values()].filter(it => (folderId === "all" || it.folder === folderId) && (!onlyCart || state.cart.includes(it.id))).length;

function renderRail() {
  const fs = [{ id: "all", label: t("all") }, ...state.lib.folders];
  const btn = (f) => `<button class="ri" data-f="${f.id}" aria-current="${state.filter === f.id}" aria-label="${esc(f.id === "all" ? t("all") : folderLabel(f))}"><svg viewBox="0 0 24 24">${ICONS[f.id] || ICONS.all}</svg>${f.id !== "all" && countIn(f.id, true) ? `<span class="dot">${countIn(f.id, true)}</span>` : ""}<span class="tip">${esc(f.id === "all" ? t("all") : folderLabel(f))}</span></button>`;
  $("#rail").innerHTML = btn(fs[0]) + `<span class="sep"></span>` + fs.slice(1).map(btn).join("") +
    `<button class="ri sel-btn" id="openSel" aria-label="${esc(t("open"))}"><svg viewBox="0 0 24 24">${ICONS.sel}</svg>${state.cart.length ? `<span class="dot">${state.cart.length}</span>` : ""}</button>`;
}

function renderTop() {
  const f = state.lib.folders.find(x => x.id === state.filter);
  $("#title").textContent = f ? folderLabel(f) : t("library");
  $("#eyebrow").textContent = `${libName()} · v${state.lib.version}`;
  const cats = state.cats.filter(c => state.filter === "all" || c.folder === state.filter);
  const nIn = (c) => c.groups.reduce((a, g) => a + g.items.length, 0);
  $("#stats").textContent = `${countIn(state.filter)} ${t("tokens")} · ${cats.length} ${t("groupsN")}${state.cart.length ? " · " + t("pickedN", state.cart.length) : ""}`;
  $("#tabs").innerHTML = cats.map(c => `<button class="tab" data-jump="${c.id}">${esc(catLabel(c))}<small>${nIn(c)}</small></button>`).join("");
}

const bgOf = (it) => it.css ? esc(it.css) : "background:" + esc(it.value);
const lumOf = (c) => { const n = parseInt(c.slice(1), 16); return (n >> 16) * .3 + ((n >> 8) & 255) * .59 + (n & 255) * .11; };

function preview(raw) {
  const it = loc(raw), css = esc(it.css || "");
  if (it.html) return `<div class="pv tall">${it.html}</div>`;
  switch (it.kind) {
    case "palette": return `<div class="pv pv-pal">${it.colors.map(c => `<i style="background:${c}"></i>`).join("")}</div>`;
    case "scale": return `<div class="pv pv-pal">${Object.entries(it.steps).map(([k, c]) => `<i style="background:${c};color:${lumOf(c) > 140 ? "rgba(0,0,0,.6)" : "rgba(255,255,255,.75)"}">${k}</i>`).join("")}</div>`;
    case "font": return `<div class="pv pv-font" style="${css}"><div class="big" style="${css}">Aa</div><div class="small" style="${css}">${it.vi ? t("sample") : t("noAccent")}</div></div>`;
    case "pairing": return `<div class="pv pv-pair"><div><div class="hd" style="font-family:'${esc(it.head)}';font-weight:${esc(it.headWeight)}">${t("pairH")}</div><div class="bd" style="font-family:'${esc(it.body)}'">${t("pairB")}</div></div></div>`;
    case "typescale": { const s = it.sizes, k = 46 / Math.max(...s); return `<div class="pv pv-ts"><div class="row">${s.map(x => `<span style="font-size:${Math.max(5, x * k).toFixed(1)}px">Aa</span>`).join("")}</div></div>`; }
    case "radius": return `<div class="pv pv-rad"><div style="${css}"></div></div>`;
    case "button": return `<div class="pv pv-btn" style="background:${esc(it.bg)}"><span class="b" style="${css}">${t("btn")}${it.code === "BT12" ? " →" : ""}</span></div>`;
    case "background": return `<div class="pv" style="${css}"></div>`;
    case "format": { const r = Math.min(150 / it.w, 100 / it.h); return `<div class="pv pv-fmt"><div class="f" style="width:${(it.w * r).toFixed(0)}px;height:${(it.h * r).toFixed(0)}px">${it.w}×${it.h}</div></div>`; }
    case "color": {
      const hex = (it.value.match(/#[0-9A-Fa-f]{6}/) || ["#000000"])[0];
      return `<div class="pv"><div class="sw" style="${bgOf(it)};color:${lumOf(hex) > 140 ? "#0D1D2A" : "rgba(255,255,255,.6)"}"><span>${it.code === "B03" ? "Aa M0" : ""}</span><span>${esc(hex)}</span></div></div>`;
    }
    case "text": return `<div class="pv pv-text"><p style="${css}">${esc(it.name)}</p></div>`;
    case "type": return `<div class="pv pv-type"><div style="${css}">${esc(it.sample)}</div></div>`;
    case "effect":
      if (it.id === "E09") return `<div class="pv pv-fx-text" style="background:#0B0D10"><svg viewBox="0 0 120 60" width="120" height="60"><defs><linearGradient id="g-E09" x1="0" x2="1"><stop offset="0" stop-color="#4AA3EA"/><stop offset="1" stop-color="#FF6B9A"/></linearGradient></defs><text x="60" y="47" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="46" fill="url(#g-E09)">KV</text></svg></div>`;
      if (it.el === "text") return `<div class="pv pv-fx-text" style="background:${esc(it.bg || "#0B0D10")}"><div style="${css}">KV</div></div>`;
      return `<div class="pv pv-effect"${it.bg ? ` style="background:${esc(it.bg)}"` : ""}><div class="fx${it.id === "E03" ? " glow" : ""}" style="${css}">${esc(it.code)}</div></div>`;
    case "frame": {
      const box = /K01|K03|K06/.test(it.id) || /K0[7-9]|K1[01]/.test(it.id);
      const inner = it.id === "K04" ? t("input") : (box || it.id === "K12") ? t("cardText") : "";
      const k05 = it.id === "K05" ? `<span style="width:20px;height:20px;border-radius:50%;background:#0D1D2A;margin-left:auto;margin-right:3px"></span>` : "";
      const bg = it.id === "K02" ? "background:#14171C;" : "";
      return `<div class="pv pv-frame"><div class="fr${box || it.id === "K04" ? " box" : ""}" style="${bg}${css}">${inner}${k05}</div></div>`;
    }
    case "icon": return `<div class="pv pv-icon"><svg viewBox="0 0 24 24">${it.svg}</svg></div>`;
    case "layout": {
      const c = (it.css || "").replace(/margin-top:[^;]+;?/, "").replace(/gap:\s*(\d+)px/, (m, n) => `gap:${Math.max(4, Math.round(n / 3))}px`).replace(/44px|36px/g, m => Math.round(parseInt(m) / 2) + "px");
      return `<div class="pv"><div class="lay ${it.id.toLowerCase()}" style="${esc(c)}">${"<i></i>".repeat(it.cells || 3)}</div></div>`;
    }
    case "rule": return `<div class="pv pv-rule"><p><b>${esc(it.name)}:</b> ${esc(it.text)}</p></div>`;
  }
  return `<div class="pv"></div>`;
}

function mini(it) {
  if (it.kind === "color") return `<span class="mini" style="${bgOf(it)}"></span>`;
  if (it.kind === "icon") return `<span class="mini"><svg viewBox="0 0 24 24">${it.svg}</svg></span>`;
  if (it.colors || it.steps) { const cs = it.colors || Object.values(it.steps); return `<span class="mini" style="background:linear-gradient(90deg,${cs.map((c, i) => `${c} ${i / cs.length * 100}% ${(i + 1) / cs.length * 100}%`).join(",")})"></span>`; }
  if (it.kind === "background") return `<span class="mini" style="${esc(it.css)}"></span>`;
  return `<span class="mini">${esc(it.code)}</span>`;
}

function card(raw, i) {
  const it = loc(raw), on = state.cart.includes(it.id);
  return `<article class="item${on ? " picked" : ""}" data-id="${it.id}" role="button" tabindex="0" aria-pressed="${on}">
    <div class="media">${preview(raw)}<span class="pick" aria-hidden="true"><svg class="pl" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg><svg class="ck" viewBox="0 0 24 24"><path d="m6 12.5 4 4 8-9"/></svg></span></div>
    <div class="info">
      <div class="name">${esc(it.name)}</div>
      <div class="meta"><span class="code">${esc(it.code)}</span>${it.theme ? `<span class="theme-tag">${esc(it.theme)}</span>` : ""}<span class="val">${esc(it.value)}</span></div>
    </div>
  </article>`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const match = (raw) => {
    if (!q) return true;
    const it = loc(raw), en = state.en?.items[raw.id] || {};
    return [raw.code, raw.name, raw.value, raw.theme, raw.css, raw.ai, raw.desc, raw.family, raw.mood, raw.use, en.name, en.value, en.desc, en.mood, en.use, it.name].join(" ").toLowerCase().includes(q);
  };
  let n = 0;
  const catHtml = (c) => {
    const groups = c.groups.map(g => {
      const items = g.items.filter(match);
      if (!items.length) return "";
      return `${c.groups.length > 1 && groupLabel(g.label) !== catLabel(c) ? `<div class="group-label">${esc(groupLabel(g.label))}</div>` : ""}<div class="grid">${items.map(x => card(x, n++)).join("")}</div>`;
    }).join("");
    if (!groups) return "";
    const note = catNote(c);
    const cnt = c.groups.reduce((a, g) => a + g.items.filter(match).length, 0);
    return `<section class="section" id="sec-${c.id}"><div class="section-head"><h3>${esc(catLabel(c))}</h3><span class="codes">${esc(c.prefix)}</span><span class="cnt">${cnt} ${t("tokens")}</span>${note ? `<span class="note">${esc(note)}</span>` : ""}</div>${groups}</section>`;
  };
  const html = state.lib.folders.filter(f => state.filter === "all" || state.filter === f.id).map(f => {
    const body = state.cats.filter(c => c.folder === f.id).map(catHtml).join("");
    if (!body) return "";
    return `<div class="folder">${state.filter === "all" ? `<div class="folder-head"><h2>${esc(folderLabel(f))}</h2><p>${esc(folderDesc(f))}</p></div>` : `<div class="folder-head"><p>${esc(folderDesc(f))}</p></div>`}${body}</div>`;
  }).join("");
  $("#main").innerHTML = html || `<div class="state">${t("noMatch", esc(state.q))}</div>`;
}

function toggle(id) {
  const i = state.cart.indexOf(id);
  i >= 0 ? state.cart.splice(i, 1) : state.cart.push(id);
  saveCart();
  document.querySelectorAll(`#main .item[data-id="${id}"]`).forEach(el => {
    const on = state.cart.includes(id);
    el.classList.toggle("picked", on);
    el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    el.setAttribute("aria-pressed", on);
  });
  updateSelected(); renderRail(); renderTop();
}

const cartItems = () => [...state.items.values()].filter(it => state.cart.includes(it.id));

function valueFor(raw) {
  const it = loc(raw);
  if (it.kind === "icon") return `SVG 24×24, stroke 1.5, round, fill none: <svg viewBox="0 0 24 24">${it.svg}</svg>`;
  if (it.kind === "rule") return it.text;
  const p = [it.value];
  if (it.steps) p.push(Object.entries(it.steps).map(([k, c]) => `${k} ${c}`).join(", "));
  if (it.mood) p.push(it.mood);
  if (it.desc) p.push(`${t("useFor")}: ${it.desc}`);
  if (it.use) p.push(`${t("useFor")}: ${it.use}`);
  if (it.suggest) p.push(`${t("suggest")}: ${it.suggest}`);
  if (it.css) p.push(`CSS: ${it.css}`);
  if (it.hover) p.push(`Hover: ${it.hover}`);
  if (it.url) p.push(`Link: ${it.url}`);
  if (it.ai) p.push(`${t("aiKw")}: ${it.ai}`);
  return p.join(" | ");
}

function specText() {
  const its = cartItems(), lib = state.lib;
  if (!its.length) return "";
  const out = [`${t("specHead")} · ${libName()} v${lib.version}`, t("specCount", its.length)];
  if ($("#withLink").checked) { out.push(`${t("specSite")}: ${SITE_URL}`); out.push(`${t("specData")}: ${DATA_URL}`); }
  const miss = progressCounts().missing;
  if (miss.length) out.push(`${t("missing")}: ${miss.map(stepLabel).join(", ")}`);
  out.push(t("specRule"), "");
  let cat = "";
  its.forEach(raw => {
    const c = catLabel(catOf(raw));
    if (c !== cat) { cat = c; out.push(`[${cat}]`); }
    const it = loc(raw);
    out.push(`${codeLabel(it)} · ${it.name}: ${valueFor(raw)}`);
  });
  return out.join("\n");
}

function specJson() {
  const lib = state.lib;
  const its = cartItems().map(raw => {
    const it = loc(raw);
    const o = { code: it.code, category: catLabel(catOf(raw)), name: it.name, value: it.value };
    if (it.theme) o.theme = it.theme;
    if (it.css) o.css = it.css;
    if (it.hover) o.hover = it.hover;
    if (it.url) o.url = it.url;
    if (it.svg) o.svg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${it.svg}</svg>`;
    if (it.text) o.rule = it.text;
    ["colors", "steps", "ai", "desc", "use", "mood", "family", "suggest", "w", "h", "sizes"].forEach(k => { if (it[k] !== undefined) o[k] = it[k]; });
    return o;
  });
  if (!its.length) return "";
  const head = { library: lib.name, version: lib.version, type: "key visual brief", language: lang };
  if ($("#withLink").checked) { head.site = SITE_URL; head.data = DATA_URL; }
  return JSON.stringify({ ...head, tokens: its }, null, 2);
}

const steps = () => state.lib.brief || [];
const stepLabel = (s) => (EN() && EN().brief?.[s.id]?.[0]) || s.label;
const stepHint = (s) => (EN() && EN().brief?.[s.id]?.[1]) || s.hint;
const stepItems = (s) => cartItems().filter(it => s.cats.includes(it.catId));
function progressCounts() {
  const req = steps().filter(s => s.required);
  return { total: req.length, done: req.filter(s => stepItems(s).length).length, missing: req.filter(s => !stepItems(s).length) };
}
function renderProgress() {
  const { total, done, missing } = progressCounts(), pct = total ? Math.round(done / total * 100) : 0, ok = done === total;
  const CK = '<svg viewBox="0 0 24 24"><path d="m6 12.5 4 4 8-9"/></svg>';
  const row = (s, i) => {
    const its = stepItems(s), has = its.length > 0;
    const right = has ? `<span class="st-r done">${CK}${its.length > 1 ? its.length : ""}</span>` : s.required ? `<span class="st-r need">${t("need")}</span>` : `<span class="st-r optl">${t("optional")}</span>`;
    const chips = has ? `<div class="chips">${its.map(raw => { const it = loc(raw); return `<span class="chip">${mini(it)}<code>${esc(it.code)}</code><span class="nm">${esc(it.name)}</span><button class="rm" data-rm="${it.id}" aria-label="${esc(t("remove", it.code))}">✕</button></span>`; }).join("")}</div>` : "";
    return `<li class="step${has ? " ok" : ""}${s.required ? "" : " opt"}" data-step="${s.id}" role="button" tabindex="0"><div class="step-row"><span class="num">${i + 1}</span><span class="sl"><b>${esc(stepLabel(s))}</b><small>${esc(stepHint(s))}</small></span>${right}</div>${chips}</li>`;
  };
  const all = steps(), req = all.filter(s => s.required), opt = all.filter(s => !s.required);
  const optDone = opt.filter(s => stepItems(s).length).length;
  $("#prog").innerHTML = `<div class="psum"><div class="psum-h"><b>${t("progress")}</b><span><strong>${done}</strong> / ${total}</span></div>
      <div class="bar${ok ? " done" : ""}"><i style="width:${pct}%"></i></div>
      <p class="prog-msg${ok ? " ok" : ""}">${ok ? t("ready") : t("left", missing.length)}</p></div>
    <div style="margin-top:18px"><div class="glabel"><span>${t("reqH")}</span><span>${done}/${total}</span></div><div class="inset"><ul class="steps">${req.map(s => row(s, all.indexOf(s))).join("")}</ul></div></div>
    <div style="margin-top:18px"><div class="glabel"><span>${t("optH")}</span><span>${optDone}/${opt.length}</span></div><div class="inset"><ul class="steps">${opt.map(s => row(s, all.indexOf(s))).join("")}</ul></div></div>`;
  const pb = $("#pbar"); pb.classList.toggle("done", ok); pb.firstElementChild.style.width = pct + "%";
}
function goStep(id) {
  const s = steps().find(x => x.id === id); if (!s) return;
  const withPick = s.cats.find(c => stepItems(s).some(i => i.catId === c)) || s.cats[0];
  const cat = state.cats.find(c => c.id === withPick); if (!cat) return;
  openSel(false); state.q = ""; $("#q").value = "";
  if (state.filter !== "all" && state.filter !== cat.folder) goFolder(cat.folder);
  document.getElementById("sec-" + cat.id)?.scrollIntoView({ block: "start" });
}

function updateSelected() {
  const n = state.cart.length, its = cartItems();
  $("#count").textContent = n; $("#count").classList.toggle("zero", !n);
  const pc = progressCounts();
  $("#selSub").textContent = t("sub2", n, pc.done, pc.total);
  renderProgress();
  const s = state.fmt === "json" ? specJson() : specText();
  $("#spec").textContent = s || "—";
  ["#copy", "#dlPdf", "#dlPng", "#clear"].forEach(k => $(k).disabled = !n);
}

function applyLang() {
  document.documentElement.lang = lang === "en" ? "en" : "vi";
  $("#langVi").setAttribute("aria-pressed", lang === "vi"); $("#langEn").setAttribute("aria-pressed", lang === "en");
  $("#q").placeholder = t("search");
  $("#selTitle").textContent = t("brief"); $("#outLabel").textContent = t("out"); $("#fmtLabel").textContent = t("fmt");
  $("#withLinkLabel").textContent = t("withLink"); $("#specSummary").textContent = t("viewSpec");
  $("#copy").innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg><span>${t("copy")}</span>`; $("#clear").textContent = t("clear");
  document.title = t("library");
  renderRail(); renderTop(); render(); updateSelected();
}
function setLang(l) { lang = l; try { localStorage.setItem("hyan-lang", l); } catch (e) {} applyLang(); }

function openSel(open) { $("#aside").classList.toggle("open", open); $("#scrim").hidden = !open; }
function toast(msg, ms = 2200) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, ms); }

/* Export: build a solid brief sheet, render to canvas, save as PNG or PDF */
function buildSheet() {
  const lib = state.lib, its = cartItems();
  const today = new Date().toLocaleDateString(lang === "en" ? "en-GB" : "vi-VN");
  const about = (EN() && EN().about) || lib.about;
  $("#sheet").innerHTML = `
    <div class="sh-head">
      <div><div class="kicker">${esc(libName())}</div><h2>${t("sheetTitle")}</h2><p class="sh-style">${esc(about)}</p></div>
      <div class="sh-meta">${today}<br>${its.length} ${t("tokens")}<br>v${esc(lib.version)}</div>
    </div>
    <div class="sh-grid">${its.map(raw => { const it = loc(raw); return `
      <div class="sh-card"><div class="sh-tag">${esc(catLabel(catOf(raw)))}</div>${preview(raw)}
        <div class="sh-info">
          <div class="row1"><span class="code">${esc(it.code)}</span>${it.theme ? `<span class="theme-tag">${esc(it.theme)}</span>` : ""}<span class="name">${esc(it.name)}</span></div>
          <div class="val">${esc(it.value)}</div>
          ${it.kind === "rule" ? `<div class="sh-css">${esc(it.text)}</div>` : it.css ? `<div class="sh-css">${esc(it.css)}</div>` : ""}
          ${it.ai ? `<div class="sh-css">AI: ${esc(it.ai)}</div>` : ""}
        </div>
      </div>`; }).join("")}</div>
    <div class="sh-foot"><span>${esc(libName())} v${esc(lib.version)}</span><span>${esc(SITE_URL)}</span></div>`;
}

async function renderSheet() {
  if (!window.html2canvas) throw new Error("lib");
  buildSheet();
  try { await document.fonts.ready; } catch (e) {}
  return html2canvas($("#sheet"), { backgroundColor: "#0B0B10", scale: 2, useCORS: true, logging: false });
}

async function saveFile(filename, blob) {
  let dl = null;
  if (window.claude && window.claude.use) {
    try { dl = await Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 4000))]); } catch (e) { dl = null; }
  }
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast(t("saved", filename)); }
    catch (e) { toast(e && e.code === "declined" ? t("declined") : t("cantSave")); }
    return;
  }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(t("downloaded", filename));
}

const stamp = () => new Date().toISOString().slice(0, 10);

async function exportPng(btn) {
  busy(btn, true);
  try {
    const cv = await renderSheet();
    const blob = await new Promise(r => cv.toBlob(r, "image/png"));
    await saveFile(`brief-kv-${stamp()}.png`, blob);
  } catch (e) { toast(t("pngFail")); }
  busy(btn, false);
}

async function exportPdf(btn) {
  busy(btn, true);
  try {
    const cv = await renderSheet();
    const { jsPDF } = window.jspdf;
    const pw = 595.28, ph = 841.89; // A4, pt
    const pageH = Math.floor(cv.width * ph / pw);
    const pdf = new jsPDF({ unit: "pt", format: "a4", compress: true });
    pdf.setProperties({ title: t("sheetTitle"), subject: specText(), creator: state.lib.name });
    for (let y = 0, i = 0; y < cv.height; y += pageH, i++) {
      const h = Math.min(pageH, cv.height - y);
      const part = document.createElement("canvas"); part.width = cv.width; part.height = pageH;
      const g = part.getContext("2d"); g.fillStyle = "#0B0B10"; g.fillRect(0, 0, part.width, part.height);
      g.drawImage(cv, 0, y, cv.width, h, 0, 0, cv.width, h);
      if (i) pdf.addPage();
      pdf.addImage(part.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, pw, ph);
    }
    await saveFile(`brief-kv-${stamp()}.pdf`, pdf.output("blob"));
  } catch (e) { toast(t("pdfFail")); }
  busy(btn, false);
}

function busy(btn, on) { btn.disabled = on; if (on) { btn.dataset.label = btn.innerHTML; btn.innerHTML = t("making"); } else if (btn.dataset.label) { btn.innerHTML = btn.dataset.label; } }

function goFolder(id) { state.filter = id; renderRail(); renderTop(); render(); $("#mainScroll").scrollTo({ top: 0 }); }

document.addEventListener("click", (e) => {
  const ri = e.target.closest(".ri[data-f]");
  if (ri) { goFolder(ri.dataset.f); return; }
  if (e.target.closest("#openSel")) { openSel(true); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump) { document.getElementById("sec-" + jump.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const rm = e.target.closest("[data-rm]");
  if (rm) { toggle(rm.dataset.rm); return; }
  if (e.target.closest(".chip")) return;
  const st = e.target.closest("[data-step]");
  if (st) { goStep(st.dataset.step); return; }
  const cardEl = e.target.closest("#main .item");
  if (cardEl) { toggle(cardEl.dataset.id); return; }
});
$("#q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("#langVi").onclick = () => setLang("vi");
$("#langEn").onclick = () => setLang("en");
$("#closeSel").onclick = () => openSel(false);
$("#scrim").onclick = () => openSel(false);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") openSel(false);
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-step]")) { e.preventDefault(); goStep(e.target.dataset.step); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("#main .item")) { e.preventDefault(); toggle(e.target.dataset.id); }
});
$("#fmtText").onclick = () => { state.fmt = "text"; $("#fmtText").setAttribute("aria-pressed", true); $("#fmtJson").setAttribute("aria-pressed", false); updateSelected(); };
$("#fmtJson").onclick = () => { state.fmt = "json"; $("#fmtJson").setAttribute("aria-pressed", true); $("#fmtText").setAttribute("aria-pressed", false); updateSelected(); };
$("#withLink").onchange = updateSelected;
$("#clear").onclick = () => { state.cart = []; saveCart(); render(); updateSelected(); renderRail(); renderTop(); };
$("#dlPng").onclick = (e) => exportPng(e.currentTarget);
$("#dlPdf").onclick = (e) => exportPdf(e.currentTarget);
$("#copy").onclick = () => {
  const s = state.fmt === "json" ? specJson() : specText();
  const fallback = () => { $(".specbox").open = true; const r = document.createRange(); r.selectNodeContents($("#spec")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast(t("selectHint")); };
  try { navigator.clipboard.writeText(s).then(() => toast(t("copied", state.cart.length)), fallback); } catch (e) { fallback(); }
};

$("#main").innerHTML = `<div class="state">${t("loading")}</div>`;
load();
</script>
