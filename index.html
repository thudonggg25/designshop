<meta charset="utf-8">
<title>Thư viện Hyan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: glassy dashboard after the reference video. Floating icon rail on the left, one large smoked-glass board with the catalog (scrolls) and a "Selected" column on the right. Warm ambient glow behind. Single dark look. */
:root {
  color-scheme: dark;
  --bg: #0A0605;
  --panel: rgba(28, 20, 17, 0.58);
  --panel-2: rgba(255, 255, 255, 0.045);
  --card: rgba(255, 255, 255, 0.05);
  --card-hi: rgba(255, 255, 255, 0.085);
  --edge: rgba(255, 255, 255, 0.09);
  --edge-2: rgba(255, 255, 255, 0.18);
  --fg: #FFFFFF;
  --fg-2: rgba(255, 255, 255, 0.82);
  --muted: rgba(255, 255, 255, 0.58);
  --faint: rgba(255, 255, 255, 0.38);
  --acc: #FF6A1A;
  --acc-2: #FF8F4A;
  --acc-soft: rgba(255, 106, 26, 0.16);
  --pos: #3DDC97;
  --pos-soft: rgba(61, 220, 151, 0.14);
  --tile: #050608;
  --sheet: #0C0907; --sheet-card: #18120F;
  --sans: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --blur: blur(28px) saturate(150%);
  --rail-w: 64px;
  --aside-w: 360px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--bg); }
body { color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

/* Warm ambient room behind the glass */
.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 45% at 50% 78%, rgba(255, 106, 26, .55), transparent 70%),
    radial-gradient(ellipse 30% 40% at 12% 30%, rgba(120, 70, 40, .35), transparent 70%),
    radial-gradient(ellipse 25% 35% at 90% 25%, rgba(160, 90, 50, .28), transparent 70%),
    radial-gradient(ellipse 18% 60% at 4% 80%, rgba(40, 60, 30, .35), transparent 70%),
    linear-gradient(180deg, #120B08 0%, #0A0605 55%, #1A0D06 100%); }
.ambient::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,.55) 100%); }

.glass { background: var(--panel); border: 1px solid var(--edge); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 30px 80px rgba(0,0,0,.5); }

/* App shell */
.app { height: 100%; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); gap: 18px; align-items: center;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Icon rail */
.rail { position: relative; z-index: 20; justify-self: center; width: var(--rail-w); border-radius: 999px; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.rail .sep { width: 24px; height: 1px; background: var(--edge-2); margin: 4px 0; }
.ri { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; transition: background .2s, color .2s, box-shadow .2s, transform .2s; }
.ri svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ri:hover { color: var(--fg); background: var(--card-hi); }
.ri[aria-current="true"] { background: var(--acc); color: #fff; box-shadow: 0 0 0 4px rgba(255,106,26,.18), 0 6px 22px rgba(255,106,26,.55); }
.ri .tip { position: absolute; left: calc(100% + 14px); top: 50%; transform: translateY(-50%) translateX(-4px); white-space: nowrap; background: rgba(20,14,12,.92); border: 1px solid var(--edge-2); padding: 6px 10px; border-radius: 10px; font-size: 12.5px; color: var(--fg); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 30; }
.ri:hover .tip, .ri:focus-visible .tip { opacity: 1; transform: translateY(-50%) translateX(0); }
.ri .dot { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--acc); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.ri[aria-current="true"] .dot { background: #fff; color: var(--acc); }
.ri.sel-btn { display: none; }

/* Board */
.board { height: 100%; min-height: 0; border-radius: 28px; display: grid; grid-template-columns: minmax(0, 1fr) var(--aside-w); overflow: hidden; }
.main { min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
.top { position: sticky; top: 0; z-index: 10; padding: 22px 26px 14px; background: linear-gradient(180deg, rgba(22,15,12,.92) 70%, rgba(22,15,12,0)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.top-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.title { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.title h1 { font-size: clamp(20px, 2.4vw, 26px); font-weight: 700; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.title .orb { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #b9b9c0 40%, #55555c); box-shadow: 0 0 10px rgba(255,255,255,.25); flex: none; }
.stats { display: flex; align-items: center; gap: 18px; padding: 8px 16px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--edge); }
.stats div { display: flex; flex-direction: column; line-height: 1.2; }
.stats small { font-size: 10.5px; color: var(--faint); }
.stats b { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats b.pos { color: var(--pos); }
.lang { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--edge); }
.lang button { border: 0; background: transparent; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.lang button[aria-pressed="true"] { background: var(--acc); color: #fff; }
.tools { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.search { flex: 0 1 260px; min-width: 160px; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--edge); }
.search svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 1.6; flex: none; }
.search input { background: transparent; border: 0; outline: 0; width: 100%; min-width: 0; font-size: 13px; }
.search input::placeholder { color: var(--faint); }
.search:focus-within { border-color: rgba(255,106,26,.6); }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1 1 300px; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid var(--edge); background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 13px; font-size: 12.5px; white-space: nowrap; }
.tab:hover { color: var(--fg); background: var(--card); }
.tab small { font-family: var(--mono); font-size: 10.5px; opacity: .65; margin-left: 5px; }

.content { padding: 4px 26px 40px; }
.folder { margin-top: 26px; }
.folder-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.folder-head h2 { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--acc-2); margin: 0; }
.folder-head p { margin: 0; color: var(--faint); font-size: 12.5px; }
.section { margin-top: 20px; scroll-margin-top: 140px; }
.section-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.section-head h3 { font-size: 17px; font-weight: 600; margin: 0; }
.section-head .codes { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--edge); border-radius: 999px; padding: 1px 8px; }
.section-head .note { color: var(--faint); font-size: 12px; flex-basis: 100%; }
.group-label { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 16px 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }

/* Token card */
.item { position: relative; display: flex; flex-direction: column; border-radius: 18px; padding: 7px; background: var(--card); border: 1px solid var(--edge); transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .2s, background .2s, box-shadow .25s; min-width: 0; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 25ms); }
.item:hover { transform: translateY(-5px); background: var(--card-hi); border-color: var(--edge-2); box-shadow: 0 16px 34px rgba(0,0,0,.35); }
.item.picked { border-color: rgba(255,106,26,.75); box-shadow: 0 0 0 1px rgba(255,106,26,.35), 0 14px 34px rgba(255,106,26,.16); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.pv { height: 124px; display: grid; place-items: center; padding: 14px; background: var(--tile); border-radius: 12px; border: 1px solid rgba(255,255,255,.05); overflow: hidden; position: relative; cursor: pointer; }
.info { padding: 10px 7px 4px; display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
.row1 { display: flex; align-items: baseline; gap: 7px; min-width: 0; flex-wrap: wrap; }
.code { font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--fg); background: rgba(255,255,255,.08); border-radius: 6px; padding: 1px 6px; flex: none; }
.theme-tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--edge); border-radius: 6px; padding: 0 5px; flex: none; }
.name { font-size: 13px; color: var(--fg-2); min-width: 0; overflow-wrap: anywhere; }
.val { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.add { margin-top: 8px; align-self: flex-start; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--edge-2); background: transparent; font-size: 12px; color: var(--fg-2); transition: background .2s, color .2s; }
.add:hover { background: var(--card-hi); color: var(--fg); }
.picked .add { background: var(--acc-soft); border-color: rgba(255,106,26,.6); color: var(--acc-2); font-weight: 600; }
.check { position: absolute; top: 13px; right: 13px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--acc); color: #fff; display: none; align-items: center; font-size: 11px; font-weight: 700; z-index: 2; box-shadow: 0 4px 14px rgba(255,106,26,.5); }
.picked .check { display: inline-flex; }

/* Preview kinds (solid colors, so exports render exactly) */
.pv.tall { height: 150px; padding: 0; }
.sw { width: 100%; height: 100%; border-radius: 10px; border: 1px solid rgba(255,255,255,.07); display: flex; align-items: flex-end; justify-content: space-between; padding: 10px 12px; font-family: var(--mono); font-size: 11px; }
.pv-text { background: #14171C; }
.pv-text p { margin: 0; font-size: 16px; text-align: center; font-family: "Segoe UI", "Be Vietnam Pro", system-ui, sans-serif; }
.pv-type > div { font-family: "Segoe UI", "Be Vietnam Pro", system-ui, sans-serif; max-width: 100%; text-align: center; overflow-wrap: anywhere; color: #fff; }
.pv-effect { background: radial-gradient(circle at 28% 35%, rgba(74,163,234,.35), transparent 42%), radial-gradient(circle at 75% 70%, rgba(240,178,122,.35), transparent 44%), #050608; }
.fx { width: 128px; height: 74px; border-radius: 16px; background: #14171C; display: grid; place-items: center; color: rgba(255,255,255,.6); font-size: 11px; font-family: var(--mono); }
.fx.glow { background: #4AA3EA; color: #fff; }
.pv-frame .fr { font-size: 12px; color: rgba(255,255,255,.6); display: flex; align-items: center; max-width: 100%; }
.pv-frame .fr.box { width: 160px; }
.pv-icon svg { width: 44px; height: 44px; stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.lay { width: 100%; }
.lay > i { display: block; min-height: 26px; border-radius: 6px; background: #1E2229; border: 1px solid rgba(255,255,255,.07); }
.lay.l02 > i { min-height: 18px; }
.lay.l02 > i:nth-child(1) { background: #050608; height: 22px; }
.lay.l02 > i:nth-child(2) { background: rgba(74,163,234,.25); }
.lay.l04 > i:first-child { min-height: 8px; width: 40%; background: rgba(255,255,255,.18); }
.lay.l04 > i:last-child { min-height: 52px; }
.pv-rule { background: #0B0D10; place-items: start; }
.pv-rule p { margin: 0; font-size: 12px; color: rgba(255,255,255,.62); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.pv-rule b { color: #fff; font-weight: 600; }
.pv-pal { padding: 0; display: flex; align-items: stretch; }
.pv-pal > i { flex: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-style: normal; font-family: var(--mono); font-size: 9px; }
.pv-font { flex-direction: column; gap: 4px; text-align: center; background: #0B0D10; }
.pv-font .big { font-size: 44px; line-height: 1; color: #fff; }
.pv-font .small { font-size: 13px; color: rgba(255,255,255,.7); }
.pv-pair { background: #F5F3EF; color: #18181B; text-align: left; place-items: center start; padding: 16px 18px; }
.pv-pair .hd { font-size: 24px; line-height: 1.05; }
.pv-pair .bd { font-size: 11.5px; line-height: 1.45; color: #52525B; margin-top: 6px; }
.pv-ts { place-items: end start; padding: 12px 14px; background: #0B0D10; }
.pv-ts .row { display: flex; align-items: baseline; gap: 8px; color: #fff; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; line-height: 1; }
.pv-rad > div { width: 96px; height: 70px; background: #E9E9EC; }
.pv-btn span.b { display: inline-block; font-family: "Be Vietnam Pro", sans-serif; font-size: 13px; border: 0; white-space: nowrap; }
.pv-fmt { background: #0B0D10; }
.pv-fmt .f { border: 1.5px solid rgba(255,255,255,.7); background: rgba(255,255,255,.06); display: grid; place-items: center; font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,.8); border-radius: 3px; }
.pv-fx-text > div { font-family: "Be Vietnam Pro", sans-serif; font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -.01em; }

.state { padding: 60px 0; text-align: center; color: var(--muted); }

/* Selected column (right) */
.aside { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--edge); background: rgba(255,255,255,.025); }
.ah { display: flex; align-items: center; justify-content: space-between; padding: 22px 22px 6px; }
.ah h2 { margin: 0; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.badge { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--acc); color: #fff; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.badge.zero { background: rgba(255,255,255,.1); color: var(--muted); }
.ah .x { display: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--edge); background: var(--card); }
.asub { padding: 0 22px; color: var(--faint); font-size: 12px; margin: 0; }
.sumrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 16px 22px 6px; }
.sum { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); text-align: center; min-width: 0; }
.sum .c { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--edge); background: var(--card); display: grid; place-items: center; position: relative; }
.sum .c svg { width: 18px; height: 18px; stroke: var(--fg-2); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sum .c b { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--acc); color: #fff; font-size: 10px; display: grid; place-items: center; }
.sum > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.ab { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 22px 12px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
.lines-label { font-size: 12.5px; font-weight: 600; color: var(--fg-2); display: flex; justify-content: space-between; }
.lines { display: flex; flex-direction: column; gap: 6px; }
.line { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px 7px 7px; border-radius: 14px; background: var(--card); border: 1px solid var(--edge); animation: rise .3s ease both; }
.line .t { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.line .nm { font-size: 12.5px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line .ct { font-size: 10.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line .r { display: flex; align-items: center; gap: 4px; }
.line .tag { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: var(--pos-soft); color: var(--pos); }
.line .rm { width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent; color: var(--faint); font-size: 13px; }
.line .rm:hover { background: rgba(255,255,255,.1); color: var(--fg); }
.mini { width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,.08); display: grid; place-items: center; overflow: hidden; background: var(--tile); font-size: 10px; color: var(--muted); font-family: var(--mono); }
.mini svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.empty { color: var(--muted); text-align: center; padding: 26px 12px; border: 1px dashed var(--edge-2); border-radius: 16px; font-size: 13px; }
.opts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--edge); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 4px 11px; border-radius: 999px; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: rgba(255,255,255,.12); color: var(--fg); font-weight: 600; }
.opts label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
details.specbox summary { cursor: pointer; font-size: 12.5px; color: var(--muted); list-style: none; }
details.specbox summary::-webkit-details-marker { display: none; }
details.specbox summary::before { content: "▸ "; }
details.specbox[open] summary::before { content: "▾ "; }
.spec { margin: 8px 0 0; font-family: var(--mono); font-size: 11px; line-height: 1.6; color: var(--fg-2); background: rgba(0,0,0,.35); border: 1px solid var(--edge); border-radius: 12px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30vh; overflow-y: auto; }
.af { padding: 14px 22px 20px; border-top: 1px solid var(--edge); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cta { grid-column: 1 / -1; height: 46px; border-radius: 14px; border: 0; background: linear-gradient(180deg, var(--acc-2), var(--acc)); color: #fff; font-weight: 700; font-size: 14px; box-shadow: 0 10px 26px rgba(255,106,26,.4), inset 0 1px 0 rgba(255,255,255,.3); transition: transform .15s, box-shadow .2s; }
.cta:hover { transform: translateY(-1px); box-shadow: 0 14px 32px rgba(255,106,26,.5), inset 0 1px 0 rgba(255,255,255,.3); }
.sec { height: 40px; border-radius: 12px; border: 1px solid var(--edge-2); background: var(--card); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.sec:hover { background: var(--card-hi); }
.sec svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.clear { grid-column: 1 / -1; background: transparent; border: 0; color: var(--faint); font-size: 12px; padding: 2px; }
.clear:hover { color: var(--fg); }
.cta:disabled, .sec:disabled, .clear:disabled { opacity: .4; cursor: default; transform: none; box-shadow: none; }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #fff; color: #120B08; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,.4); }

/* Export sheet: off-screen, solid colors only */
#sheet { position: fixed; left: -10000px; top: 0; width: 1200px; background: var(--sheet); color: #fff; font-family: var(--sans); padding: 56px; }
#sheet .sh-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: 28px; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 28px; }
#sheet .kicker { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #FF8F4A; }
#sheet h2 { font-weight: 800; font-size: 40px; text-transform: uppercase; margin: 6px 0 0; line-height: 1.05; }
#sheet .sh-meta { text-align: right; font-family: var(--mono); font-size: 13px; color: rgba(255,255,255,.6); line-height: 1.7; }
#sheet .sh-style { color: rgba(255,255,255,.7); font-size: 14px; margin: 10px 0 0; max-width: 70ch; }
#sheet .sh-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
#sheet .sh-tag { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.45); padding: 4px 8px 8px; }
#sheet .sh-card { background: var(--sheet-card); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 8px; }
#sheet .item, #sheet .line { animation: none; }
#sheet .pv { cursor: default; }
#sheet .sh-info { padding: 12px 8px 8px; display: flex; flex-direction: column; gap: 5px; }
#sheet .sh-css { font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,.55); overflow-wrap: anywhere; line-height: 1.5; }
#sheet .sh-foot { margin-top: 32px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.12); font-family: var(--mono); font-size: 12px; color: rgba(255,255,255,.5); display: flex; justify-content: space-between; gap: 20px; }

/* Narrower screens: rail moves to the bottom, Selected becomes a sheet */
@media (max-width: 1100px) { :root { --aside-w: 310px; } }
@media (max-width: 920px) {
  body { overflow: hidden; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 10px; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); align-items: stretch; }
  .rail { order: 2; width: 100%; flex-direction: row; justify-content: space-between; padding: 6px 8px; overflow-x: auto; scrollbar-width: none; }
  .rail .sep { display: none; }
  .ri { flex: none; }
  .ri .tip { display: none; }
  .ri.sel-btn { display: grid; }
  .board { grid-template-columns: minmax(0, 1fr); border-radius: 22px; backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(24,16,13,.9); }
  .aside { position: fixed; left: 0; right: 0; bottom: 0; height: 82%; z-index: 50; border-left: 0; border-radius: 24px 24px 0 0; background: rgba(24,16,13,.96); border-top: 1px solid var(--edge-2); transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .aside.open { transform: none; }
  .ah .x { display: grid; place-items: center; }
  .top { padding: 16px 16px 10px; }
  .content { padding: 4px 16px 30px; }
  .stats { display: none; }
  .sumrow { display: none; }
}
@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .pv { height: 104px; }
  .pv.tall { height: 128px; }
  .search { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

<script>
// Link công khai của thư viện (trang web và dữ liệu trên GitHub).
const SITE_URL = "https://thudonggg25.github.io/designshop/";
const DATA_URL = "https://github.com/thudonggg25/designshop/tree/main/data";

const UI = {
  vi: {
    all: "Tất cả", library: "Thư viện Hyan", loading: "Đang tải thư viện…", loadFail: "Không tải được dữ liệu thư viện (thư mục data/). Tải lại trang để thử lần nữa.",
    search: "Tìm: glass, P09, Playfair, story", items: "Món", selected: "Đang chọn", folders: "Thư mục", noMatch: q => `Không có món nào khớp “${q}”.`,
    pick: "+ Chọn", picked: "✓ Đã chọn", chosen: "Đã chọn", list: "Danh sách", sub: n => n ? `${n} món sẽ vào brief key visual` : "Bấm “+ Chọn” trên các thẻ để thêm",
    empty: "Chưa chọn món nào. Đi qua từng thư mục ở menu bên trái và chọn món hợp ý.", withLink: "Kèm link", viewSpec: "Xem spec sẽ copy",
    copy: "Copy brief cho AI", clear: "Xoá hết", copied: n => `Đã copy ${n} món`, selectHint: "Đã bôi đen spec, nhấn Ctrl+C để copy",
    making: "Đang tạo…", saved: f => `Đã lưu ${f}`, downloaded: f => `Đã tải ${f}`, declined: "Đã huỷ tải xuống", cantSave: "Không tải được file ở chế độ xem này",
    pngFail: "Chưa tạo được ảnh. Kiểm tra mạng rồi thử lại.", pdfFail: "Chưa tạo được PDF. Kiểm tra mạng rồi thử lại.", remove: c => `Bỏ ${c}`,
    specHead: "BRIEF KEY VISUAL", specCount: n => `Gồm ${n} lựa chọn, xếp theo thư mục: định hướng, màu, chữ, hình khối, hiệu ứng, bố cục, quy tắc.`,
    specSite: "Xem hình minh hoạ toàn bộ thư viện", specData: "Dữ liệu gốc (JSON)", specRule: "Quy ước: dùng đúng mã và giá trị bên dưới, không tự đổi màu hay kích thước.",
    useFor: "Dùng cho", suggest: "Gợi ý kèm", aiKw: "Từ khoá AI", sheetTitle: "Brief key visual", tokens: "món", sample: "Thiết kế tiếng Việt", noAccent: "Design without accents",
    pairH: "Ưu đãi mùa hè", pairB: "Giảm 30% cho đơn đầu tiên. Áp dụng toàn bộ cửa hàng đến hết tháng.", btn: "Mua ngay", input: "Nhập nội dung…", cardText: "Nội dung thẻ", open: "Đang chọn"
  },
  en: {
    all: "All", library: "Hyan Library", loading: "Loading library…", loadFail: "Couldn't load the library data (data/ folder). Reload the page to try again.",
    search: "Search: glass, P09, Playfair, story", items: "Items", selected: "Selected", folders: "Folders", noMatch: q => `Nothing matches “${q}”.`,
    pick: "+ Pick", picked: "✓ Picked", chosen: "Picked", list: "List", sub: n => n ? `${n} items go into the key visual brief` : "Press “+ Pick” on any card to add it",
    empty: "Nothing picked yet. Go through each folder in the left menu and pick what fits.", withLink: "Include links", viewSpec: "Preview the brief",
    copy: "Copy brief for AI", clear: "Clear all", copied: n => `Copied ${n} items`, selectHint: "Brief selected, press Ctrl+C to copy",
    making: "Creating…", saved: f => `Saved ${f}`, downloaded: f => `Downloaded ${f}`, declined: "Download cancelled", cantSave: "Can't save files in this view",
    pngFail: "Couldn't create the image. Check your connection and try again.", pdfFail: "Couldn't create the PDF. Check your connection and try again.", remove: c => `Remove ${c}`,
    specHead: "KEY VISUAL BRIEF", specCount: n => `${n} choices, ordered by folder: direction, color, type, shapes, effects, layout, rules.`,
    specSite: "Visual previews of the whole library", specData: "Source data (JSON)", specRule: "Rule: use the exact codes and values below; don't change colors or sizes.",
    useFor: "Use for", suggest: "Pairs with", aiKw: "AI keywords", sheetTitle: "Key visual brief", tokens: "items", sample: "Thiết kế tiếng Việt", noAccent: "Design without accents",
    pairH: "Summer deals", pairB: "30% off your first order. Valid storewide until the end of the month.", btn: "Shop now", input: "Type here…", cardText: "Card content", open: "Selected"
  }
};

const ICONS = {
  all: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
  "dinh-huong": '<circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  "mau-sac": '<path d="M12 3.5c3 3.6 6 7 6 10.2a6 6 0 0 1-12 0c0-3.2 3-6.6 6-10.2z"/>',
  "chu": '<path d="M5 6.5V5h14v1.5M12 5v14M9 19h6"/>',
  "hinh-khoi": '<rect x="3.5" y="11" width="9" height="9" rx="1.5"/><circle cx="16" cy="8" r="4.5"/>',
  "hieu-ung": '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  "bo-cuc": '<rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M10 9.5V20"/>',
  "quy-tac": '<path d="M6 4h9l3 3v13H6z"/><path d="M9 12l2 2 4-4"/>',
  sel: '<path d="M4 5h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 8H7"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/>'
};

let lang = "vi";
try { lang = localStorage.getItem("hyan-lang") === "en" ? "en" : "vi"; } catch (e) {}
const libName = () => (lang === "en" && state.en?.name) || state.lib.name;
const t = (k, ...a) => { const v = UI[lang][k]; return typeof v === "function" ? v(...a) : v; };

const state = { lib: null, en: null, cats: [], items: new Map(), filter: "all", q: "", cart: [], fmt: "text" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

try { state.cart = JSON.parse(localStorage.getItem("hyan-cart") || "[]"); } catch (e) { state.cart = []; }
const saveCart = () => { try { localStorage.setItem("hyan-cart", JSON.stringify(state.cart)); } catch (e) {} };

/* Localisation of data */
const EN = () => (lang === "en" && state.en) || null;
function loc(it) {
  const en = EN(); if (!en) return it;
  const o = en.items[it.id]; if (!o) return it;
  const r = { ...it, ...o };
  if (it.kind === "mood" && it.html && o.name) r.html = it.html.replace(`>${it.name}<`, `>${esc(o.name)}<`);
  return r;
}
const folderLabel = (f) => (EN() && EN().folders[f.id]?.label) || f.label;
const folderDesc = (f) => (EN() && EN().folders[f.id]?.desc) || f.desc;
const catLabel = (c) => (EN() && EN().categories[c.id]?.label) || c.label;
const catNote = (c) => (EN() && (EN().categories[c.id]?.note || EN().categories[c.id]?.style)) || c.note || c.style || "";
const groupLabel = (g) => (EN() && EN().groups[g]) || g;
const codeLabel = (it) => it.theme ? `${it.code} (${it.theme})` : it.code;
const catOf = (it) => state.cats.find(c => c.id === it.catId);

async function load() {
  try {
    const lib = await (await fetch("data/library.json")).json();
    state.lib = lib;
    const cats = lib.folders.flatMap(f => f.categories.map(c => ({ ...c, folder: f.id })));
    const [files, en] = await Promise.all([
      Promise.all(cats.map(c => fetch("data/" + c.file).then(r => r.json()))),
      fetch("data/i18n.en.json").then(r => r.ok ? r.json() : null).catch(() => null)
    ]);
    state.en = en;
    state.cats = cats.map((c, i) => ({ ...c, ...files[i] }));
    state.cats.forEach(c => c.groups.forEach(g => g.items.forEach(it => {
      it.kind = c.kind; it.catId = c.id; it.folder = c.folder; it.group = g.label;
      state.items.set(it.id, it);
    })));
    state.cart = state.cart.filter(id => state.items.has(id));
    loadFonts(); applyLang();
  } catch (e) {
    $("#main").innerHTML = `<div class="state">${t("loadFail")}</div>`;
  }
}

function loadFonts() {
  const fc = state.cats.find(c => c.kind === "font"); if (!fc) return;
  const fams = fc.groups.flatMap(g => g.items).map(f => `family=${f.family.replace(/ /g, "+")}:wght@${f.weights}`);
  fams.push("family=Noto+Serif+JP:wght@500");
  const l = document.createElement("link"); l.rel = "stylesheet";
  l.href = `https://fonts.googleapis.com/css2?${fams.join("&")}&display=swap`;
  (document.head || document.body).appendChild(l);
}

const countIn = (folderId, onlyCart) => [...state.items.values()].filter(it => (folderId === "all" || it.folder === folderId) && (!onlyCart || state.cart.includes(it.id))).length;

function renderRail() {
  const fs = [{ id: "all", label: t("all") }, ...state.lib.folders];
  const btn = (f) => `<button class="ri" data-f="${f.id}" aria-current="${state.filter === f.id}" aria-label="${esc(f.id === "all" ? t("all") : folderLabel(f))}"><svg viewBox="0 0 24 24">${ICONS[f.id] || ICONS.all}</svg>${f.id !== "all" && countIn(f.id, true) ? `<span class="dot">${countIn(f.id, true)}</span>` : ""}<span class="tip">${esc(f.id === "all" ? t("all") : folderLabel(f))}</span></button>`;
  $("#rail").innerHTML = btn(fs[0]) + `<span class="sep"></span>` + fs.slice(1).map(btn).join("") +
    `<button class="ri sel-btn" id="openSel" aria-label="${esc(t("open"))}"><svg viewBox="0 0 24 24">${ICONS.sel}</svg>${state.cart.length ? `<span class="dot">${state.cart.length}</span>` : ""}</button>`;
}

function renderTop() {
  const f = state.lib.folders.find(x => x.id === state.filter);
  $("#title").textContent = f ? folderLabel(f) : t("library");
  $("#stats").innerHTML = `<div><small>${t("items")}</small><b>${countIn(state.filter)}</b></div><div><small>${t("selected")}</small><b class="pos">${state.cart.length}</b></div><div><small>${t("folders")}</small><b>${state.lib.folders.length}</b></div>`;
  const cats = state.cats.filter(c => state.filter === "all" || c.folder === state.filter);
  $("#tabs").innerHTML = cats.map(c => `<button class="tab" data-jump="${c.id}">${esc(catLabel(c))}<small>${esc(c.prefix)}</small></button>`).join("");
}

const bgOf = (it) => it.css ? esc(it.css) : "background:" + esc(it.value);
const lumOf = (c) => { const n = parseInt(c.slice(1), 16); return (n >> 16) * .3 + ((n >> 8) & 255) * .59 + (n & 255) * .11; };

function preview(raw) {
  const it = loc(raw), css = esc(it.css || "");
  if (it.html) return `<div class="pv tall">${it.html}</div>`;
  switch (it.kind) {
    case "palette": return `<div class="pv pv-pal">${it.colors.map(c => `<i style="background:${c}"></i>`).join("")}</div>`;
    case "scale": return `<div class="pv pv-pal">${Object.entries(it.steps).map(([k, c]) => `<i style="background:${c};color:${lumOf(c) > 140 ? "rgba(0,0,0,.6)" : "rgba(255,255,255,.75)"}">${k}</i>`).join("")}</div>`;
    case "font": return `<div class="pv pv-font" style="${css}"><div class="big" style="${css}">Aa</div><div class="small" style="${css}">${it.vi ? t("sample") : t("noAccent")}</div></div>`;
    case "pairing": return `<div class="pv pv-pair"><div><div class="hd" style="font-family:'${esc(it.head)}';font-weight:${esc(it.headWeight)}">${t("pairH")}</div><div class="bd" style="font-family:'${esc(it.body)}'">${t("pairB")}</div></div></div>`;
    case "typescale": { const s = it.sizes, k = 46 / Math.max(...s); return `<div class="pv pv-ts"><div class="row">${s.map(x => `<span style="font-size:${Math.max(5, x * k).toFixed(1)}px">Aa</span>`).join("")}</div></div>`; }
    case "radius": return `<div class="pv pv-rad"><div style="${css}"></div></div>`;
    case "button": return `<div class="pv pv-btn" style="background:${esc(it.bg)}"><span class="b" style="${css}">${t("btn")}${it.code === "BT12" ? " →" : ""}</span></div>`;
    case "background": return `<div class="pv" style="${css}"></div>`;
    case "format": { const r = Math.min(150 / it.w, 100 / it.h); return `<div class="pv pv-fmt"><div class="f" style="width:${(it.w * r).toFixed(0)}px;height:${(it.h * r).toFixed(0)}px">${it.w}×${it.h}</div></div>`; }
    case "color": {
      const hex = (it.value.match(/#[0-9A-Fa-f]{6}/) || ["#000000"])[0];
      return `<div class="pv"><div class="sw" style="${bgOf(it)};color:${lumOf(hex) > 140 ? "#0D1D2A" : "rgba(255,255,255,.6)"}"><span>${it.code === "B03" ? "Aa M0" : ""}</span><span>${esc(hex)}</span></div></div>`;
    }
    case "text": return `<div class="pv pv-text"><p style="${css}">${esc(it.name)}</p></div>`;
    case "type": return `<div class="pv pv-type"><div style="${css}">${esc(it.sample)}</div></div>`;
    case "effect":
      if (it.id === "E09") return `<div class="pv pv-fx-text" style="background:#0B0D10"><svg viewBox="0 0 120 60" width="120" height="60"><defs><linearGradient id="g-E09" x1="0" x2="1"><stop offset="0" stop-color="#4AA3EA"/><stop offset="1" stop-color="#FF6B9A"/></linearGradient></defs><text x="60" y="47" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="46" fill="url(#g-E09)">KV</text></svg></div>`;
      if (it.el === "text") return `<div class="pv pv-fx-text" style="background:${esc(it.bg || "#0B0D10")}"><div style="${css}">KV</div></div>`;
      return `<div class="pv pv-effect"${it.bg ? ` style="background:${esc(it.bg)}"` : ""}><div class="fx${it.id === "E03" ? " glow" : ""}" style="${css}">${esc(it.code)}</div></div>`;
    case "frame": {
      const box = /K01|K03|K06/.test(it.id) || /K0[7-9]|K1[01]/.test(it.id);
      const inner = it.id === "K04" ? t("input") : (box || it.id === "K12") ? t("cardText") : "";
      const k05 = it.id === "K05" ? `<span style="width:20px;height:20px;border-radius:50%;background:#0D1D2A;margin-left:auto;margin-right:3px"></span>` : "";
      const bg = it.id === "K02" ? "background:#14171C;" : "";
      return `<div class="pv pv-frame"><div class="fr${box || it.id === "K04" ? " box" : ""}" style="${bg}${css}">${inner}${k05}</div></div>`;
    }
    case "icon": return `<div class="pv pv-icon"><svg viewBox="0 0 24 24">${it.svg}</svg></div>`;
    case "layout": {
      const c = (it.css || "").replace(/margin-top:[^;]+;?/, "").replace(/gap:\s*(\d+)px/, (m, n) => `gap:${Math.max(4, Math.round(n / 3))}px`).replace(/44px|36px/g, m => Math.round(parseInt(m) / 2) + "px");
      return `<div class="pv"><div class="lay ${it.id.toLowerCase()}" style="${esc(c)}">${"<i></i>".repeat(it.cells || 3)}</div></div>`;
    }
    case "rule": return `<div class="pv pv-rule"><p><b>${esc(it.name)}:</b> ${esc(it.text)}</p></div>`;
  }
  return `<div class="pv"></div>`;
}

function mini(it) {
  if (it.kind === "color") return `<span class="mini" style="${bgOf(it)}"></span>`;
  if (it.kind === "icon") return `<span class="mini"><svg viewBox="0 0 24 24">${it.svg}</svg></span>`;
  if (it.colors || it.steps) { const cs = it.colors || Object.values(it.steps); return `<span class="mini" style="background:linear-gradient(90deg,${cs.map((c, i) => `${c} ${i / cs.length * 100}% ${(i + 1) / cs.length * 100}%`).join(",")})"></span>`; }
  if (it.kind === "background") return `<span class="mini" style="${esc(it.css)}"></span>`;
  return `<span class="mini">${esc(it.code)}</span>`;
}

function card(raw, i) {
  const it = loc(raw), on = state.cart.includes(it.id);
  return `<article class="item${on ? " picked" : ""}" data-id="${it.id}" style="--i:${Math.min(i, 16)}">
    <span class="check" aria-hidden="true">${t("chosen")}</span>
    ${preview(raw)}
    <div class="info">
      <div class="row1"><span class="code">${esc(it.code)}</span>${it.theme ? `<span class="theme-tag">${esc(it.theme)}</span>` : ""}<span class="name">${esc(it.name)}</span></div>
      <div class="val">${esc(it.value)}</div>
      <button class="add" data-id="${it.id}" aria-pressed="${on}">${on ? t("picked") : t("pick")}</button>
    </div>
  </article>`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const match = (raw) => {
    if (!q) return true;
    const it = loc(raw), en = state.en?.items[raw.id] || {};
    return [raw.code, raw.name, raw.value, raw.theme, raw.css, raw.ai, raw.desc, raw.family, raw.mood, raw.use, en.name, en.value, en.desc, en.mood, en.use, it.name].join(" ").toLowerCase().includes(q);
  };
  let n = 0;
  const catHtml = (c) => {
    const groups = c.groups.map(g => {
      const items = g.items.filter(match);
      if (!items.length) return "";
      return `${c.groups.length > 1 ? `<div class="group-label">${esc(groupLabel(g.label))}</div>` : ""}<div class="grid">${items.map(x => card(x, n++)).join("")}</div>`;
    }).join("");
    if (!groups) return "";
    const note = catNote(c);
    return `<section class="section" id="sec-${c.id}"><div class="section-head"><h3>${esc(catLabel(c))}</h3><span class="codes">${esc(c.prefix)}</span>${note ? `<span class="note">${esc(note)}</span>` : ""}</div>${groups}</section>`;
  };
  const html = state.lib.folders.filter(f => state.filter === "all" || state.filter === f.id).map(f => {
    const body = state.cats.filter(c => c.folder === f.id).map(catHtml).join("");
    if (!body) return "";
    return `<div class="folder">${state.filter === "all" ? `<div class="folder-head"><h2>${esc(folderLabel(f))}</h2><p>${esc(folderDesc(f))}</p></div>` : `<div class="folder-head"><p>${esc(folderDesc(f))}</p></div>`}${body}</div>`;
  }).join("");
  $("#main").innerHTML = html || `<div class="state">${t("noMatch", esc(state.q))}</div>`;
}

function toggle(id) {
  const i = state.cart.indexOf(id);
  i >= 0 ? state.cart.splice(i, 1) : state.cart.push(id);
  saveCart();
  document.querySelectorAll(`#main .item[data-id="${id}"]`).forEach(el => {
    const on = state.cart.includes(id);
    el.classList.toggle("picked", on);
    const b = el.querySelector(".add"); b.textContent = on ? t("picked") : t("pick"); b.setAttribute("aria-pressed", on);
  });
  updateSelected(); renderRail(); renderTop();
}

const cartItems = () => [...state.items.values()].filter(it => state.cart.includes(it.id));

function valueFor(raw) {
  const it = loc(raw);
  if (it.kind === "icon") return `SVG 24×24, stroke 1.5, round, fill none: <svg viewBox="0 0 24 24">${it.svg}</svg>`;
  if (it.kind === "rule") return it.text;
  const p = [it.value];
  if (it.steps) p.push(Object.entries(it.steps).map(([k, c]) => `${k} ${c}`).join(", "));
  if (it.mood) p.push(it.mood);
  if (it.desc) p.push(`${t("useFor")}: ${it.desc}`);
  if (it.use) p.push(`${t("useFor")}: ${it.use}`);
  if (it.suggest) p.push(`${t("suggest")}: ${it.suggest}`);
  if (it.css) p.push(`CSS: ${it.css}`);
  if (it.ai) p.push(`${t("aiKw")}: ${it.ai}`);
  return p.join(" | ");
}

function specText() {
  const its = cartItems(), lib = state.lib;
  if (!its.length) return "";
  const out = [`${t("specHead")} · ${libName()} v${lib.version}`, t("specCount", its.length)];
  if ($("#withLink").checked) { out.push(`${t("specSite")}: ${SITE_URL}`); out.push(`${t("specData")}: ${DATA_URL}`); }
  out.push(t("specRule"), "");
  let cat = "";
  its.forEach(raw => {
    const c = catLabel(catOf(raw));
    if (c !== cat) { cat = c; out.push(`[${cat}]`); }
    const it = loc(raw);
    out.push(`${codeLabel(it)} · ${it.name}: ${valueFor(raw)}`);
  });
  return out.join("\n");
}

function specJson() {
  const lib = state.lib;
  const its = cartItems().map(raw => {
    const it = loc(raw);
    const o = { code: it.code, category: catLabel(catOf(raw)), name: it.name, value: it.value };
    if (it.theme) o.theme = it.theme;
    if (it.css) o.css = it.css;
    if (it.svg) o.svg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${it.svg}</svg>`;
    if (it.text) o.rule = it.text;
    ["colors", "steps", "ai", "desc", "use", "mood", "family", "suggest", "w", "h", "sizes"].forEach(k => { if (it[k] !== undefined) o[k] = it[k]; });
    return o;
  });
  if (!its.length) return "";
  const head = { library: lib.name, version: lib.version, type: "key visual brief", language: lang };
  if ($("#withLink").checked) { head.site = SITE_URL; head.data = DATA_URL; }
  return JSON.stringify({ ...head, tokens: its }, null, 2);
}

function updateSelected() {
  const n = state.cart.length, its = cartItems();
  $("#count").textContent = n; $("#count").classList.toggle("zero", !n);
  $("#selSub").textContent = t("sub", n);
  $("#sumrow").innerHTML = state.lib.folders.map(f => {
    const k = countIn(f.id, true);
    return `<div class="sum" role="button" tabindex="0" data-f="${f.id}"><span class="c"><svg viewBox="0 0 24 24">${ICONS[f.id]}</svg>${k ? `<b>${k}</b>` : ""}</span><span>${esc(folderLabel(f))}</span></div>`;
  }).join("");
  $("#lines").innerHTML = its.length ? its.map(raw => { const it = loc(raw); return `<div class="line">${mini(it)}<span class="t"><span class="nm">${esc(it.name)}</span><span class="ct">${esc(catLabel(catOf(raw)))}</span></span><span class="r"><span class="tag">${esc(it.code)}</span><button class="rm" data-rm="${it.id}" aria-label="${esc(t("remove", it.code))}">✕</button></span></div>`; }).join("")
    : `<div class="empty">${t("empty")}</div>`;
  const s = state.fmt === "json" ? specJson() : specText();
  $("#spec").textContent = s || "—";
  ["#copy", "#dlPdf", "#dlPng", "#clear"].forEach(k => $(k).disabled = !n);
}

function applyLang() {
  document.documentElement.lang = lang === "en" ? "en" : "vi";
  $("#langVi").setAttribute("aria-pressed", lang === "vi"); $("#langEn").setAttribute("aria-pressed", lang === "en");
  $("#q").placeholder = t("search");
  $("#selTitle").textContent = t("selected"); $("#linesLabel").textContent = t("list");
  $("#withLinkLabel").textContent = t("withLink"); $("#specSummary").textContent = t("viewSpec");
  $("#copy").textContent = t("copy"); $("#clear").textContent = t("clear");
  document.title = t("library");
  renderRail(); renderTop(); render(); updateSelected();
}
function setLang(l) { lang = l; try { localStorage.setItem("hyan-lang", l); } catch (e) {} applyLang(); }

function openSel(open) { $("#aside").classList.toggle("open", open); $("#scrim").hidden = !open; }
function toast(msg, ms = 2200) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, ms); }

/* Export: build a solid brief sheet, render to canvas, save as PNG or PDF */
function buildSheet() {
  const lib = state.lib, its = cartItems();
  const today = new Date().toLocaleDateString(lang === "en" ? "en-GB" : "vi-VN");
  const about = (EN() && EN().about) || lib.about;
  $("#sheet").innerHTML = `
    <div class="sh-head">
      <div><div class="kicker">${esc(libName())}</div><h2>${t("sheetTitle")}</h2><p class="sh-style">${esc(about)}</p></div>
      <div class="sh-meta">${today}<br>${its.length} ${t("tokens")}<br>v${esc(lib.version)}</div>
    </div>
    <div class="sh-grid">${its.map(raw => { const it = loc(raw); return `
      <div class="sh-card"><div class="sh-tag">${esc(catLabel(catOf(raw)))}</div>${preview(raw)}
        <div class="sh-info">
          <div class="row1"><span class="code">${esc(it.code)}</span>${it.theme ? `<span class="theme-tag">${esc(it.theme)}</span>` : ""}<span class="name">${esc(it.name)}</span></div>
          <div class="val">${esc(it.value)}</div>
          ${it.kind === "rule" ? `<div class="sh-css">${esc(it.text)}</div>` : it.css ? `<div class="sh-css">${esc(it.css)}</div>` : ""}
          ${it.ai ? `<div class="sh-css">AI: ${esc(it.ai)}</div>` : ""}
        </div>
      </div>`; }).join("")}</div>
    <div class="sh-foot"><span>${esc(libName())} v${esc(lib.version)}</span><span>${esc(SITE_URL)}</span></div>`;
}

async function renderSheet() {
  if (!window.html2canvas) throw new Error("lib");
  buildSheet();
  try { await document.fonts.ready; } catch (e) {}
  return html2canvas($("#sheet"), { backgroundColor: "#0C0907", scale: 2, useCORS: true, logging: false });
}

async function saveFile(filename, blob) {
  let dl = null;
  if (window.claude && window.claude.use) {
    try { dl = await Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 4000))]); } catch (e) { dl = null; }
  }
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast(t("saved", filename)); }
    catch (e) { toast(e && e.code === "declined" ? t("declined") : t("cantSave")); }
    return;
  }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(t("downloaded", filename));
}

const stamp = () => new Date().toISOString().slice(0, 10);

async function exportPng(btn) {
  busy(btn, true);
  try {
    const cv = await renderSheet();
    const blob = await new Promise(r => cv.toBlob(r, "image/png"));
    await saveFile(`brief-kv-${stamp()}.png`, blob);
  } catch (e) { toast(t("pngFail")); }
  busy(btn, false);
}

async function exportPdf(btn) {
  busy(btn, true);
  try {
    const cv = await renderSheet();
    const { jsPDF } = window.jspdf;
    const pw = 595.28, ph = 841.89; // A4, pt
    const pageH = Math.floor(cv.width * ph / pw);
    const pdf = new jsPDF({ unit: "pt", format: "a4", compress: true });
    pdf.setProperties({ title: t("sheetTitle"), subject: specText(), creator: state.lib.name });
    for (let y = 0, i = 0; y < cv.height; y += pageH, i++) {
      const h = Math.min(pageH, cv.height - y);
      const part = document.createElement("canvas"); part.width = cv.width; part.height = pageH;
      const g = part.getContext("2d"); g.fillStyle = "#0C0907"; g.fillRect(0, 0, part.width, part.height);
      g.drawImage(cv, 0, y, cv.width, h, 0, 0, cv.width, h);
      if (i) pdf.addPage();
      pdf.addImage(part.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, pw, ph);
    }
    await saveFile(`brief-kv-${stamp()}.pdf`, pdf.output("blob"));
  } catch (e) { toast(t("pdfFail")); }
  busy(btn, false);
}

function busy(btn, on) { btn.disabled = on; if (on) { btn.dataset.label = btn.innerHTML; btn.innerHTML = t("making"); } else if (btn.dataset.label) { btn.innerHTML = btn.dataset.label; } }

function goFolder(id) { state.filter = id; renderRail(); renderTop(); render(); $("#mainScroll").scrollTo({ top: 0 }); }

document.addEventListener("click", (e) => {
  const ri = e.target.closest(".ri[data-f], .sum[data-f]");
  if (ri) { goFolder(ri.dataset.f); if (ri.classList.contains("sum")) openSel(false); return; }
  if (e.target.closest("#openSel")) { openSel(true); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump) { document.getElementById("sec-" + jump.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const add = e.target.closest(".add");
  if (add) { toggle(add.dataset.id); return; }
  const pv = e.target.closest("#main .pv");
  if (pv) { toggle(pv.closest(".item").dataset.id); return; }
  const rm = e.target.closest("[data-rm]");
  if (rm) { toggle(rm.dataset.rm); return; }
});
$("#q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("#langVi").onclick = () => setLang("vi");
$("#langEn").onclick = () => setLang("en");
$("#closeSel").onclick = () => openSel(false);
$("#scrim").onclick = () => openSel(false);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") openSel(false);
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".sum[data-f]")) { e.preventDefault(); goFolder(e.target.dataset.f); }
});
$("#fmtText").onclick = () => { state.fmt = "text"; $("#fmtText").setAttribute("aria-pressed", true); $("#fmtJson").setAttribute("aria-pressed", false); updateSelected(); };
$("#fmtJson").onclick = () => { state.fmt = "json"; $("#fmtJson").setAttribute("aria-pressed", true); $("#fmtText").setAttribute("aria-pressed", false); updateSelected(); };
$("#withLink").onchange = updateSelected;
$("#clear").onclick = () => { state.cart = []; saveCart(); render(); updateSelected(); renderRail(); renderTop(); };
$("#dlPng").onclick = (e) => exportPng(e.currentTarget);
$("#dlPdf").onclick = (e) => exportPdf(e.currentTarget);
$("#copy").onclick = () => {
  const s = state.fmt === "json" ? specJson() : specText();
  const fallback = () => { $(".specbox").open = true; const r = document.createRange(); r.selectNodeContents($("#spec")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast(t("selectHint")); };
  try { navigator.clipboard.writeText(s).then(() => toast(t("copied", state.cart.length)), fallback); } catch (e) { fallback(); }
};

$("#main").innerHTML = `<div class="state">${t("loading")}</div>`;
load();
</script>
